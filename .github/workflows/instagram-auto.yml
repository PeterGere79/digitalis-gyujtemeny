name: Instagram automatic museum post

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
      timezone: "Europe/Budapest"

permissions:
  contents: write

jobs:
  instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pillow

      - name: Prepare post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: gpt-5-mini
          OPENAI_IMAGE_MODEL: gpt-image-2.5-flare
          INSTAGRAM_AUTOMATION_MODE: prepare
        run: python automation/instagram_auto.py

      - name: Commit prepared post
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "museum-instagram-bot"
            git config user.email "museum-instagram-bot@users.noreply.github.com"
            git add generated-instagram automation/instagram_state.json automation/pending_post.json
            git commit -m "Prepare Instagram museum post"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Wait for raw GitHub
        if: hashFiles('automation/pending_post.json') != ''
        run: sleep 8

      - name: Publish to Instagram
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: v25.0
          INSTAGRAM_AUTOMATION_MODE: publish
        run: python automation/instagram_auto.py

      - name: Commit publication state
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "museum-instagram-bot"
            git config user.email "museum-instagram-bot@users.noreply.github.com"
            git add generated-instagram automation/instagram_state.json automation/pending_post.json
            git commit -m "Record Instagram publication"
            git push
          else
            echo "No publication state changes."
          fi
