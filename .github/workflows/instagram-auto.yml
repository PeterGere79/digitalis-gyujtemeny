name: Instagram automatic photo-negative post

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Tesztfuttatás: publikáljon most a kétnapos korlátozás nélkül?"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 18 * * *"
      timezone: "Europe/Budapest"

concurrency:
  group: instagram-photo-negative
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pillow

      - name: Prepare photo-negative post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: gpt-5-mini
          INSTAGRAM_AUTOMATION_MODE: prepare
          FORCE_POST: ${{ github.event.inputs.force || 'false' }}
        run: |
          python automation/fotonegativ_auto.py

      - name: Commit prepared post
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "museum-instagram-bot"
            git config user.email "museum-instagram-bot@users.noreply.github.com"
            git add generated-instagram automation/fotonegativ_state.json automation/pending_fotonegativ.json
            git commit -m "Prepare Instagram photo-negative post"
            git pull --rebase origin main
            git push
          else
            echo "No new post prepared."
          fi

      - name: Wait for raw GitHub
        if: hashFiles('automation/pending_fotonegativ.json') != ''
        run: sleep 8

      - name: Publish to Instagram
        if: hashFiles('automation/pending_fotonegativ.json') != ''
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: v25.0
          INSTAGRAM_AUTOMATION_MODE: publish
        run: |
          python automation/fotonegativ_auto.py

      - name: Commit publication state
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "museum-instagram-bot"
            git config user.email "museum-instagram-bot@users.noreply.github.com"
            git add automation/fotonegativ_state.json automation/pending_fotonegativ.json
            git pull --rebase origin main
            git push
          else
            echo "No publication state changes."
          fi
