<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fájlnév-importáló</title><link rel="stylesheet" href="css/style.css"></head><body><div class="site"><header class="hero"><div class="brand">Tiszazugi Földrajzi Múzeum</div><h1>Fájlnév-importáló</h1><p>Válassz ki egyszerre több képet. Az eszköz a fájlnevekből automatikusan mezőkre bontja az adatokat.</p></header><main><div class="intro-note"><strong>Fájlnév-struktúra</strong><span>Rövid cégnév – Teljes cégnév – Fantázianév -- Város -- Ország -- Kódnevek -- Terjedelem -- Quelle -- Iniciálé</span></div><p><input id="files" type="file" multiple accept="image/*"></p><div id="status"></div><button id="download" disabled>JSON letöltése</button><div id="preview" class="results"></div></main></div><script>
let records=[];
function parse(name){let base=name.replace(/\.[^.]+$/,""),p=base.split(/\s+--\s+/),head=(p[0]||"").split(/\s+[–—-]\s+/),codes=(p[3]||"").split(/\s*[,;]\s*/).filter(Boolean),ct=(p[3]||"").toLowerCase(),names=["metal sign","engraving","trademark","decal","face plate","stand crest","treadle","casting","advertising graphics","award","badge","hand wheel","text"],type=names.find(t=>ct.includes(t))||"text",ini=(p[6]||"").toLowerCase();if(/ini|initial|yes|igen/.test(ini))ini="yes";else if(/noini|no initial|nem|no/.test(ini))ini="no";else ini="";return {file:name,short:head[0]||"",full:head[1]||"",fantasy:head[2]||"",city:p[1]||"",country:p[2]||"",codes,size:p[4]||"",source:p[5]||"",initial:ini,text:base,type,image:""}}
document.getElementById("files").onchange=e=>{records=[...e.target.files].map(f=>parse(f.name));document.getElementById("status").textContent=records.length+" fájl feldolgozva.";document.getElementById("download").disabled=!records.length;document.getElementById("preview").innerHTML="<div class='results-head'><span>Első 30 rekord előnézete</span></div><div class='result-grid'>"+records.slice(0,30).map(x=>"<article class='card'><div class='card-body'><div class='tag'>"+x.type+"</div><h3>"+(x.full||x.short)+"</h3><div class='card-meta'>"+x.city+" · "+x.country+" · iniciálé: "+(x.initial||"nincs megadva")+"</div><div class='filename'>"+x.file+"</div></div></article>").join("")+"</div>"};
document.getElementById("download").onclick=()=>{let b=new Blob([JSON.stringify(records,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="gyujtemeny.json";a.click()};
</script></body></html>
